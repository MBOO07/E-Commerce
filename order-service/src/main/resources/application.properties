spring.application.name=order-service
server.port=8082


# MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/order_db_m
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update


#Eureka config

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=5000ms
resilience4j.circuitbreaker.instances.productService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.productService.maxAttempts=3
resilience4j.retry.instances.productService.waitDuration=1000ms

resilience4j.bulkhead.instances.productService.maxConcurrentCalls=10
resilience4j.bulkhead.instances.productService.maxWaitDuration=500ms

resilience4j.timelimiter.instances.productService.timeoutDuration=3000ms

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,circuitbreakers,metrics
management.endpoint.health.show-details=always