server.port=8084
spring.application.name=payment-service

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Paytm Payment Gateway Configuration
paytm.mid=${PAYTM_MID:TEST_MID_12345}
paytm.merchantKey=${PAYTM_KEY:TEST_MERCHANT_KEY_67890}
paytm.website=${PAYTM_WEBSITE:WEBSTAGING}
paytm.industryTypeId=Retail
paytm.channelId=WEB
paytm.callbackUrl=http://localhost:8000/api/payments/verify
paytm.initiateUrl=https://securegw-stage.paytm.in/order/process

# Actuator & Management
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always

# Resilience4j Circuit Breaker for orderService
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.orderService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.orderService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50

# Resilience4j Retry for orderService
resilience4j.retry.instances.orderService.max-attempts=3
resilience4j.retry.instances.orderService.wait-duration=1s
resilience4j.retry.instances.orderService.enable-exponential-backoff=true
resilience4j.retry.instances.orderService.exponential-backoff-multiplier=2
